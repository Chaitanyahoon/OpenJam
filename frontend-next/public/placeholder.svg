<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <radialGradient id="groove" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a38" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#181822" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#121218" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb03a"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="120" height="120" rx="16" fill="url(#bg)" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Stylized vinyl record disc -->
  <circle cx="60" cy="60" r="42" fill="url(#groove)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="60" cy="60" r="34" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="60" cy="60" r="26" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="60" cy="60" r="18" fill="url(#amberGrad)" opacity="0.95"/>
  <circle cx="60" cy="60" r="6" fill="#0c0c12"/>

  <!-- Music Note Icon overlaid -->
  <path d="M57 53v14.5a3.5 3.5 0 1 1-2.5-3.35V56.5l8-2v9a3.5 3.5 0 1 1-2.5-3.35V51.5L57 53z" fill="#ffffff" opacity="0.95"/>
</svg>
