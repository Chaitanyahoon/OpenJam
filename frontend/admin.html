<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenJam Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
    h1 { font-family: var(--font-display); font-size: 2.5rem; margin-bottom: 2rem; color: var(--text-1); }
    .admin-container { display: none; }
    .auth-container { max-width: 400px; margin: 100px auto; padding: 30px; background: var(--bg-card); border-radius: var(--r-lg); border: 1px solid var(--border); }
    .auth-container h2 { font-family: var(--font-display); margin-bottom: 20px; }
    
    .room-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .room-table th, .room-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
    .room-table th { color: var(--text-2); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .room-table tr:hover { background: rgba(255,255,255,0.02); }
    .status-active { color: #10b981; font-weight: bold; }
    .status-inactive { color: var(--text-3); }
    .btn-delete { background: #e11d48; color: white; border: none; padding: 8px 16px; border-radius: var(--r-md); cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; }
    .btn-delete:hover { background: #be123c; }
    .error-msg { color: #e11d48; margin-bottom: 15px; font-size: 14px; display: none; }
    .loading-msg { color: var(--amber); margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- Login Form -->
  <div class="auth-container" id="auth-container">
    <h2>Admin Access</h2>
    <div class="error-msg" id="auth-error">Invalid password.</div>
    <div style="margin-bottom: 15px;">
      <label style="display:block; margin-bottom:8px; color:var(--text-2);">Admin Password</label>
      <input type="password" id="admin-password" class="input-field" style="width: 100%;" placeholder="Enter password...">
    </div>
    <button class="btn btn-primary" style="width:100%" id="btn-login">Login</button>
  </div>

  <!-- Dashboard -->
  <div class="admin-container" id="admin-container">
    <h1><span style="color: var(--amber);">OpenJam</span> Moderation Dashboard</h1>
    <div id="loading" class="loading-msg">Loading rooms...</div>
    <table class="room-table" id="room-table" style="display:none;">
      <thead>
        <tr>
          <th>Status</th>
          <th>Room Name</th>
          <th>Host</th>
          <th>Listeners</th>
          <th>Created At</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="room-list"></tbody>
    </table>
  </div>

  <script>
    const authContainer = document.getElementById('auth-container');
    const adminContainer = document.getElementById('admin-container');
    const authError = document.getElementById('auth-error');
    const roomTable = document.getElementById('room-table');
    const roomList = document.getElementById('room-list');
    const loading = document.getElementById('loading');

    // Attempt to load rooms immediately
    loadRooms();

    document.getElementById('btn-login').addEventListener('click', async () => {
      const password = document.getElementById('admin-password').value;
      if (!password) return;

      try {
        const res = await fetch('/api/auth/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        
        if (res.ok) {
          authError.style.display = 'none';
          loadRooms();
        } else {
          authError.style.display = 'block';
        }
      } catch (err) {
        console.error("Login error", err);
      }
    });

    async function loadRooms() {
      try {
        const res = await fetch('/api/admin/rooms');
        if (res.status === 401 || res.status === 403) {
          // Need to login
          authContainer.style.display = 'block';
          adminContainer.style.display = 'none';
          return;
        }

        if (!res.ok) throw new Error("Failed to fetch rooms");

        const data = await res.json();
        authContainer.style.display = 'none';
        adminContainer.style.display = 'block';
        renderRooms(data.rooms);
      } catch (err) {
        console.error(err);
      }
    }

    function renderRooms(rooms) {
      loading.style.display = 'none';
      roomTable.style.display = 'table';
      roomList.innerHTML = '';
      
      rooms.forEach(room => {
        const tr = document.createElement('tr');
        
        const date = new Date(room.created_at).toLocaleString();
        const statusHtml = room.is_active ? `<span class="status-active">Active</span>` : `<span class="status-inactive">Closed</span>`;
        
        tr.innerHTML = `
          <td>${statusHtml}</td>
          <td>
            <strong>${escapeHtml(room.name)}</strong>
            <div style="font-size:11px; color:var(--text-3); font-family:var(--font-mono)">${room.id}</div>
          </td>
          <td>${escapeHtml(room.host_name)}</td>
          <td>${room.listener_count}</td>
          <td><span style="font-size:12px; color:var(--text-2)">${date}</span></td>
          <td>
            ${room.is_active ? `<button class="btn-delete" onclick="deleteRoom('${room.id}')">Force Delete</button>` : `<span style="font-size:12px; color:var(--text-3)">Deleted</span>`}
          </td>
        `;
        roomList.appendChild(tr);
      });
    }

    async function deleteRoom(roomId) {
      if (!confirm("Are you sure you want to forcefully delete this room? Everyone inside will be kicked out.")) {
        return;
      }
      
      try {
        const res = await fetch(`/api/admin/rooms/${roomId}`, { method: 'DELETE' });
        if (res.ok) {
          loadRooms();
        } else {
          alert("Failed to delete room. You may need to log in again.");
          loadRooms();
        }
      } catch (err) {
        console.error(err);
        alert("Error deleting room.");
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, 
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
          }[tag] || tag)
      );
    }
  </script>
</body>
</html>
