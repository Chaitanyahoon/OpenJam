services:
  - type: web
    name: openjam
    runtime: docker
    dockerFilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://www.openjam.fun,https://openjam.fun,http://localhost:8000,http://localhost:3000
