name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag to upload APK to (e.g. v1.0.1-mobile, leave blank for auto)'
        required: false
        default: ''
      upload_to_release:
        description: 'Upload APK directly to the release tag'
        type: boolean
        default: true
  push:
    branches:
      - main
      - mobile-app
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Prebuild Native Android Project
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Configure Gradle Memory & Build Standalone Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          cd mobile/android
          chmod +x gradlew
          sed -i 's/-Xmx[0-9]\+m/-Xmx4096m/g' gradle.properties || true
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Package APK & Generate Checksum
        run: |
          mkdir -p build-output
          # Locate built APK
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK was not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"

          APP_VERSION=$(node -p "require('./mobile/package.json').version")
          echo "App Version: $APP_VERSION"

          # Package versioned, latest, and legacy filenames for maximum compatibility
          cp "$APK_PATH" "build-output/openjam-v${APP_VERSION}.apk"
          cp "$APK_PATH" "build-output/openjam-latest.apk"
          cp "$APK_PATH" "build-output/openjam-v1.0.0.apk"

          cd build-output
          sha256sum "openjam-v${APP_VERSION}.apk" > "openjam-v${APP_VERSION}.apk.sha256"
          sha256sum "openjam-latest.apk" > "openjam-latest.apk.sha256"
          sha256sum "openjam-v1.0.0.apk" > "openjam-v1.0.0.apk.sha256"
          cat "openjam-v${APP_VERSION}.apk.sha256"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openjam-android-apk
          path: build-output/openjam-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mobile-app' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release == true) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION=$(node -p "require('./mobile/package.json').version")
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v${APP_VERSION}-mobile"
            fi
          fi
          echo "Target Release Tag: $TAG"

          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          APK_SHA=$(awk '{print $1}' "build-output/openjam-v${APP_VERSION}.apk.sha256")
          FILE_SIZE=$(du -h "build-output/openjam-v${APP_VERSION}.apk" | awk '{print $1}')

          cat <<EOF > release_notes.md
          ## 🎧 OpenJam Android App (${TAG})

          > **Latest Release Build**: ${BUILD_DATE}  
          > **Commit**: \`${COMMIT_SHA}\` — ${COMMIT_MSG}  
          > **Package Version**: \`v${APP_VERSION}\`

          ### 📲 Direct APK Downloads
          - 📦 **Latest Release APK**: [**openjam-v${APP_VERSION}.apk**](https://github.com/Chaitanyahoon/OpenJam/releases/download/${TAG}/openjam-v${APP_VERSION}.apk) (${FILE_SIZE})
          - 📦 **Permanent Latest Link**: [**openjam-latest.apk**](https://github.com/Chaitanyahoon/OpenJam/releases/download/${TAG}/openjam-latest.apk)
          - 🔒 **SHA256 Checksum**: \`${APK_SHA}\`

          ### ✨ Key Features & Stability Improvements
          - **Synchronized Playback**: Sub-10ms drift-corrected audio streaming across room listeners.
          - **Host Controls**: Full playback controls, nudging, and queue management for room hosts.
          - **Universal Importer**: One-tap Spotify & YouTube playlist importing to queue and personal library.
          - **Optimized Chat**: Deduplicated optimistic messaging with zero double bubbles.
          - **Android System Parity**: High-Fidelity Audio toggle, haptics, and native Android App Info settings shortcut.
          - **Responsive Vinyl UI**: Clamped turntable stage preventing horizontal overflow on all screen sizes.
          EOF

          # Create or update GitHub Release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release edit "$TAG" --title "OpenJam Android App ${TAG}" --notes-file release_notes.md --latest
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" --title "OpenJam Android App ${TAG}" --notes-file release_notes.md --latest
          fi

          # Upload APK binaries and checksums (--clobber replaces previous files with newest build)
          gh release upload "$TAG" build-output/* --clobber
