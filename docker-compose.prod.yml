version: '3.9'

services:
  openjam:
    build: .
    container_name: openjam-prod
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=sqlite:////app/data/openjam.db
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - openjam_logs:/app/logs
      - openjam_data:/app/data
    networks:
      - openjam-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  openjam_logs:
    driver: local
  openjam_data:
    driver: local

networks:
  openjam-network:
    driver: bridge
